# ==============================================================================
# Nginx Configuration for keralawoods-billing.gemshine.tech
# Place this file at: /etc/nginx/sites-available/keralawoods-billing.gemshine.tech
# Enable with: sudo ln -s /etc/nginx/sites-available/keralawoods-billing.gemshine.tech /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name keralawoods-billing.gemshine.tech;

    # Allow certbot SSL challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS (Certbot will automate this too)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name keralawoods-billing.gemshine.tech;

    # SSL Certificates (Managed automatically via Certbot)
    ssl_certificate /etc/letsencrypt/live/keralawoods-billing.gemshine.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keralawoods-billing.gemshine.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Root directory for Vite Production Build
    root /var/www/keralawood-billing/dist;
    index index.html;

    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Maximum file upload size (for company logo, assets)
    client_max_body_size 25M;

    # Enable Gzip Compression for high performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/json application/xml image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 1. Reverse Proxy for Backend API (Node.js Express on port 5031)
    location /api/ {
        proxy_pass http://127.0.0.1:5031/api/;
        proxy_http_version 1.1;

        # WebSocket & connection upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_cache_bypass $http_upgrade;
    }

    # 2. Vite Static Assets (/assets/ folder with JS, CSS, images)
    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 3. Static Asset Caching for root files (favicon, logos, fonts, etc.)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
        try_files $uri =404;
    }

    # 3. Frontend Single Page Application (SPA) Fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Logs
    access_log /var/log/nginx/keralawoods_billing_access.log;
    error_log /var/log/nginx/keralawoods_billing_error.log;
}
